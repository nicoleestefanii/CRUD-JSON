<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUD Productos - Fetch + PHP OOP + MySQL</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h3 mb-1">CRUD de Productos</h1>
    <p class="text-muted">Fetch API + PHP OOP + MySQL (Guardar, Editar y Buscar)</p>

    <!-- Alerta Bootstrap para errores/avisos del formulario -->
    <div id="alertaBootstrap" class="alert alert-danger alert-dismissible d-none" role="alert">
      <div id="alertaTexto"></div>
      <button type="button" class="btn-close" aria-label="Cerrar" onclick="ocultarAlerta()"></button>
    </div>

    <div class="row g-4">
      <!-- FORMULARIO -->
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white" id="tituloForm">Registrar producto</div>
          <div class="card-body">
            <form id="formProducto" novalidate>
              <input type="hidden" name="Accion" id="Accion" value="Guardar">
              <input type="hidden" name="id" id="id" value="">

              <div class="mb-3">
                <label for="Codigo" class="form-label">Código</label>
                <input class="form-control" type="text" name="Codigo" id="Codigo" maxlength="20" required>
                <div class="invalid-feedback" id="err-Codigo"></div>
              </div>
              <div class="mb-3">
                <label for="Producto" class="form-label">Producto</label>
                <input class="form-control" type="text" name="Producto" id="Producto" maxlength="100" required>
                <div class="invalid-feedback" id="err-Producto"></div>
              </div>
              <div class="mb-3">
                <label for="Precio" class="form-label">Precio</label>
                <input class="form-control" type="number" step="0.01" min="0.01" name="Precio" id="Precio" required>
                <div class="invalid-feedback" id="err-Precio"></div>
              </div>
              <div class="mb-3">
                <label for="Cantidad" class="form-label">Cantidad</label>
                <!-- min="1" al guardar; el JS lo cambia a min="0" al modificar -->
                <input class="form-control" type="number" step="1" min="1" name="Cantidad" id="Cantidad" required>
                <div class="invalid-feedback" id="err-Cantidad"></div>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success" id="btnGuardar">Registrar</button>
                <button type="button" class="btn btn-secondary d-none" id="btnCancelar">Cancelar edición</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- LISTADO + BÚSQUEDA -->
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header">Listado de productos</div>
          <div class="card-body">
            <div class="input-group mb-3">
              <input type="text" class="form-control" id="txtBuscar" placeholder="Buscar por código o nombre...">
              <button class="btn btn-primary" type="button" id="btnBuscar">Buscar</button>
              <button class="btn btn-outline-secondary" type="button" id="btnLimpiar">Limpiar</button>
            </div>
            <div class="table-responsive">
              <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                  <tr>
                    <th>ID</th><th>Código</th><th>Producto</th>
                    <th class="text-end">Precio</th><th class="text-end">Cantidad</th><th class="text-center">Acción</th>
                  </tr>
                </thead>
                <tbody id="tablaProductos">
                  <tr><td colspan="6" class="text-center text-muted">Cargando...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
